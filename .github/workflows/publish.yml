name: Build and publish libBLS

on:
  push:
    branches:
      - beta
      - stable
  pull_request:
    branches:
      - develop
      - beta
      - stable
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('publish-pr-{0}', github.event.pull_request.number)
        || format('publish-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve_release_metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_version: ${{ steps.meta.outputs.npm_version }}
      pypi_version: ${{ steps.meta.outputs.pypi_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$BASE_REF"
          else
            BRANCH="${GITHUB_REF##*/}"
          fi
          BASE_VERSION="$(cat VERSION.txt)"
          if [[ "$BRANCH" == "stable" ]]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi

          NPM_PACKAGE_NAME="$(jq -r '.name' node/package.json)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Validation-only build: never publishes, so skip the live npm/PyPI
            # registry lookups and synthesize a deterministic, ecosystem-valid
            # version scoped to this PR instead.
            case "$BRANCH" in
              stable)
                NPM_VERSION="$BASE_VERSION"
                PYPI_VERSION="$BASE_VERSION"
                ;;
              beta)
                NPM_VERSION="${BASE_VERSION}-beta.pr${PR_NUMBER}"
                PYPI_VERSION="${BASE_VERSION}rc${PR_NUMBER}"
                ;;
              *)
                NPM_VERSION="${BASE_VERSION}-develop.pr${PR_NUMBER}"
                PYPI_VERSION="${BASE_VERSION}.dev${PR_NUMBER}"
                ;;
            esac
          else
            NPM_VERSION="$(bash ./scripts/ci/calculate_version_npm.sh "$NPM_PACKAGE_NAME" "$BASE_VERSION" "$BRANCH")"
            PYPI_VERSION="$(bash ./scripts/ci/calculate_version_pypi.sh t-encrypt "$BASE_VERSION" "$BRANCH")"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pypi_version=${PYPI_VERSION}" >> "$GITHUB_OUTPUT"

          PUBLISHABLE=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            PUBLISHABLE=true
          fi

          cat > release-manifest.json <<EOF
          {
            "source_sha": "${GITHUB_SHA}",
            "branch": "${BRANCH}",
            "version": "${BASE_VERSION}",
            "npm_version": "${NPM_VERSION}",
            "pypi_version": "${PYPI_VERSION}",
            "prerelease": ${PRERELEASE},
            "publishable": ${PUBLISHABLE}
          }
          EOF

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  build_native:
    needs: resolve_release_metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Linux & Dependencies
        uses: ./.github/actions/setup-linux-env
        with:
          extra-apt-packages: 'jq patchelf'

      - name: Configure native build
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build native binaries
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          cd build
          make -j$(nproc)

      - name: Upload native release artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ needs.resolve_release_metadata.outputs.version }}
          path: |
            build/bls_glue
            build/hash_g1
            build/verify_bls

  build_python:
    needs: resolve_release_metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Linux & Dependencies
        uses: ./.github/actions/setup-linux-env
        with:
          extra-apt-packages: 'jq patchelf'

      - name: Configure t-encrypt Python native library build
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          export CMAKE_BUILD_TYPE=Release
          mkdir -p build_t_encrypt_python
          cd build_t_encrypt_python
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build t-encrypt Python native library
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export TARGET=all
          cd build_t_encrypt_python
          make -j$(nproc) t_encrypt_python

      - name: Build t-encrypt Python distributions
        working-directory: python
        env:
          PACKAGE_VERSION: ${{ needs.resolve_release_metadata.outputs.pypi_version }}
          T_ENCRYPT_LIB_PATH: ${{ github.workspace }}/build_t_encrypt_python/threshold_encryption/libt_encrypt_python.so
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel twine auditwheel
          CURRENT_VERSION="$(python setup_t_encrypt.py --version)"
          sed -i "s/${CURRENT_VERSION}/${PACKAGE_VERSION}/g" setup_t_encrypt.py
          python setup_t_encrypt.py sdist bdist_wheel
          raw_wheel="$(ls -t dist/*.whl | head -n1)"
          [[ "${raw_wheel}" != *-py3-none-any.whl ]] || \
            { echo "Wheel bundling libencrypt.so must be platform-tagged: ${raw_wheel}" >&2; exit 1; }
          auditwheel show "${raw_wheel}"
          auditwheel repair "${raw_wheel}" -w wheelhouse
          wheel="$(ls -t wheelhouse/*.whl | head -n1)"
          [[ "${wheel}" == *manylinux*.whl ]] || { echo "Repaired wheel must be manylinux-tagged: ${wheel}" >&2; exit 1; }
          python -m zipfile -e "${wheel}" wheel-check
          shared_library="wheel-check/t_encrypt/libencrypt.so"
          [[ -f "${shared_library}" ]] || { echo "libencrypt.so was not found in ${wheel}" >&2; exit 1; }
          ! readelf -d "${shared_library}" | grep -Eq 'lib(ssl|crypto)\.so\.1\.1' || \
            { echo "${shared_library} depends on OpenSSL 1.1" >&2; exit 1; }
          python -m twine check dist/*.tar.gz wheelhouse/*.whl

      - name: Upload Python release artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ needs.resolve_release_metadata.outputs.pypi_version }}
          path: |
            python/dist/*.tar.gz
            python/wheelhouse/*.whl

  build_wasm:
    needs: resolve_release_metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Linux & Dependencies
        uses: ./.github/actions/setup-linux-env
        with:
          extra-apt-packages: 'jq patchelf'
          with-emscripten: 'true'

      - name: Configure wasm build
        run: |
          source deps/emsdk/emsdk_env.sh
          mkdir -p build_em
          cd build_em
          export LIBRARIES_ROOT=../deps/deps_inst/wasm32-emscripten/lib
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DEMSCRIPTEN=ON \
            -DBUILD_TESTS=OFF \
            -DGMP_LIBRARY="$LIBRARIES_ROOT"/libgmp.a \
            -DCRYPTOPP_LIBRARY="$LIBRARIES_ROOT"/libcrypto.a \
            -DGMPXX_LIBRARY="$LIBRARIES_ROOT"/libgmpxx.a

      - name: Build wasm binaries
        run: |
          source deps/emsdk/emsdk_env.sh
          cd build_em
          emmake make -j$(nproc)

      - name: Upload wasm build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build-${{ needs.resolve_release_metadata.outputs.version }}
          path: |
            build_em/threshold_encryption/encrypt.js
            build_em/threshold_encryption/encrypt.wasm
            build_em/threshold_encryption/encrypt.worker.js

  package_npm:
    needs:
      - resolve_release_metadata
      - build_wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wasm build artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build-${{ needs.resolve_release_metadata.outputs.version }}
          path: wasm-artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Assemble npm package
        run: |
          mkdir -p node
          cp -f wasm-artifacts/build_em/threshold_encryption/encrypt.js node/
          cp -f wasm-artifacts/build_em/threshold_encryption/encrypt.wasm node/
          cp -f wasm-artifacts/build_em/threshold_encryption/encrypt.worker.js node/
          npm --prefix node version ${{ needs.resolve_release_metadata.outputs.npm_version }} --no-git-tag-version
          npm --prefix node pack

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ needs.resolve_release_metadata.outputs.npm_version }}
          path: node/*.tgz

  ready_to_publish:
    needs:
      - resolve_release_metadata
      - build_native
      - build_python
      - package_npm
    runs-on: ubuntu-24.04
    steps:
      - name: Gate publication
        run: echo "All build jobs succeeded; publication can proceed."

  publish_pypi:
    needs:
      - resolve_release_metadata
      - ready_to_publish
      - build_python
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python artifact
        uses: actions/download-artifact@v4
        with:
          name: python-release-${{ needs.resolve_release_metadata.outputs.pypi_version }}
          path: python-artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check existing PyPI release
        id: check_pypi
        run: |
          set +e
          OUTPUT="$(python3 ./scripts/ci/check_pypi_release.py t-encrypt "${{ needs.resolve_release_metadata.outputs.pypi_version }}" "$PWD/python-artifacts")"
          CHECK_STATUS=$?
          echo "$OUTPUT"
          if [[ $CHECK_STATUS -ne 0 ]]; then
            exit $CHECK_STATUS
          fi
          if [[ "$OUTPUT" == MATCH:* ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.check_pypi.outputs.already_published != 'true'
        working-directory: python-artifacts
        env:
          TWINE_USERNAME: ${{ secrets.PIP_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PIP_PASSWORD }}
        run: |
          python -m pip install --upgrade pip twine
          python -m twine upload dist/*.tar.gz wheelhouse/*.whl

  publish_npm:
    needs:
      - resolve_release_metadata
      - ready_to_publish
      - package_npm
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ needs.resolve_release_metadata.outputs.npm_version }}
          path: npm-artifacts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check existing npm release
        id: check_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          TARBALL="$(ls -1 npm-artifacts/*.tgz | head -n 1)"
          PACKAGE_NAME="$(jq -r '.name' node/package.json)"
          OUTPUT="$(bash ./scripts/ci/check_npm_release.sh "$PACKAGE_NAME" "${{ needs.resolve_release_metadata.outputs.npm_version }}" "$TARBALL")"
          CHECK_STATUS=$?
          echo "$OUTPUT"
          if [[ $CHECK_STATUS -ne 0 ]]; then
            exit $CHECK_STATUS
          fi
          if [[ "$OUTPUT" == MATCH:* ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check_npm.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(ls -1 npm-artifacts/*.tgz | head -n 1)"
          if [[ "${{ needs.resolve_release_metadata.outputs.branch }}" == "beta" ]]; then
            npm publish "$TARBALL" --access public --tag beta
          else
            npm publish "$TARBALL" --access public
          fi

  publish_github_release:
    needs:
      - resolve_release_metadata
      - publish_pypi
      - publish_npm
      - build_native
    if: >-
      always() &&
      needs.resolve_release_metadata.outputs.branch == 'stable' &&
      github.event_name == 'push' &&
      needs.publish_pypi.result == 'success' &&
      needs.publish_npm.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: native-release-${{ needs.resolve_release_metadata.outputs.version }}
          path: native-artifacts

      - name: Validate release tag state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve_release_metadata.outputs.version }}"
          HEAD_SHA="${{ github.sha }}"
          EXISTING="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [[ -n "$EXISTING" && "$EXISTING" != "$HEAD_SHA" ]]; then
            echo "Tag ${TAG} already exists and points to a different commit; refusing to move it." >&2
            exit 1
          fi
          if [[ -z "$EXISTING" ]]; then
            git tag "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve_release_metadata.outputs.version }}
          name: ${{ needs.resolve_release_metadata.outputs.version }}
          draft: false
          prerelease: false
          files: |
            native-artifacts/bls_glue
            native-artifacts/hash_g1
            native-artifacts/verify_bls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
